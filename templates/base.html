<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="{{ url_for('site_asset', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('site_asset', filename='favicon-32.png') }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ url_for('site_asset', filename='favicon.ico') }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ url_for('site_asset', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('site_asset', filename='site.webmanifest') }}">
    <meta property="og:title" content="GPT Pull-down">
    <meta property="og:description" content="AI-assisted protein interaction hypotheses.">
    <meta property="og:image" content="{{ url_for('site_asset', filename='og-image.png', _external=True) }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="GPT Pull-down">
    <meta name="twitter:description" content="AI-assisted protein interaction hypotheses.">
    <meta name="twitter:image" content="{{ url_for('site_asset', filename='twitter-card.png', _external=True) }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>{% block title %}GPT Pull-down{% endblock %}</title>
    <style>
      body {
        color: #102033;
      }

      .site-header {
        border-bottom: 1px solid #d8dee8;
        margin-bottom: 1.5rem;
        padding: 1.25rem 0 1rem;
      }

      .site-logo {
        display: inline-flex;
        max-width: 100%;
      }

      .site-logo img {
        display: block;
        height: auto;
        max-width: min(100%, 560px);
      }

      @media (max-width: 576px) {
        .container {
          padding-left: 1rem;
          padding-right: 1rem;
        }

        .site-header {
          margin-bottom: 1.25rem;
          padding-top: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container pb-4">
      <header class="site-header">
        <a class="site-logo" href="/" aria-label="GPT Pull-down home">
          <img src="{{ url_for('site_asset', filename='logo-horizontal-tight.png') }}" alt="GPT Pull-down">
        </a>
      </header>
      {% block content %}
      {% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/6en8XCp+HHAAK5GSLf2xlYtvJ8U2Q4U+9cuEnJoa3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gybBud7M4e7tCzgHDkQ4Q/EBILJgGAC7K6W4B6V1bIVlM9z7xS" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
